<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- symcon-icons-shared: Quelle visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py -->
    <script>
/* symcon-icons-shared v3: Symcons /icons.js läuft einmal im Visu-Hauptfenster statt in jeder Kachel.
   Ersetzt das Script-Tag für /icons.js im head einer Kachel. Ohne erreichbares Hauptfenster
   (Symcon-App, direkter Aufruf, PWA) lädt die Kachel icons.js wie bisher. Symcon bleibt unverändert.
   Steht inline in einem script-Element: niemals ein schließendes Script-Tag in diesen Text schreiben.
   Quelle: visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py - Kopien nicht von Hand ändern. */
(function () {
  var w = window, d = document, host = null;
  try {
    // Fremder Ursprung wirft schon beim Zugriff auf top.document.
    if (w.top !== w && w.top.document.head) host = w.top;
  } catch (e) {
    host = null;
  }
  var slot = host ? host.__symconIcons : null;
  if (slot && slot.v >= 1 && slot.fa) {
    teilen(slot.fa, slot.css);
    return;
  }
  // Kein Hauptfenster, oder es lädt icons.js gerade erst: für sich laden wie bisher - synchron,
  // damit die Kachel-Skripte FontAwesome wie gewohnt vorfinden.
  d.write('<script src="/icons.js" crossorigin="anonymous"><\/script>'); // sicher: fester Text ohne Eingabe, das bisherige icons.js-Tag
  if (!host) return;
  if (!slot) {
    // Einmal im Hauptfenster nachladen, ohne dass FontAwesome dort das Flutter-DOM anfasst.
    try {
      // Slot und Konfiguration als Objekte des Hauptfensters: ein Objekt dieser Kachel hielte sie
      // (samt Dokument) fest, solange das Hauptfenster lebt. Aus demselben Grund lösen die Lade-Handler
      // sich nach dem Laden selbst.
      slot = new host.Object();
      slot.v = 1;
      slot.fa = null;
      slot.css = '';
      slot.fehler = false;
      host.__symconIcons = slot;
      var config = new host.Object();
      config.autoReplaceSvg = false;
      config.observeMutations = false;
      config.autoAddCss = false;
      host.FontAwesomeConfig = config;
      var s = host.document.createElement('script');
      s.src = '/icons.js';
      s.onload = function () {
        if (host.FontAwesome && host.FontAwesome.dom) {
          slot.css = host.FontAwesome.dom.css();
          slot.fa = host.FontAwesome;
        } else {
          slot.fehler = true;
        }
        s.onload = s.onerror = null;
      };
      s.onerror = function () {
        slot.fehler = true;
        s.onload = s.onerror = null;
      };
      host.document.head.appendChild(s);
    } catch (e) {
      return; // Hauptfenster nimmt kein Skript an: die Kachel bleibt beim eigenen icons.js.
    }
  }
  // Kacheln kommen beim ersten Laden fast gleichzeitig: bis das Hauptfenster bereit ist, arbeitet
  // die eigene Kopie, danach wechselt die Kachel auf die geteilte und gibt ihre eigene frei.
  var versuche = 0;
  var abwarten = function () {
    if (slot.fa && d.readyState !== 'loading') {
      wechseln(slot);
    } else if (!slot.fehler && ++versuche <= 100) {
      setTimeout(abwarten, 100);
    }
  };
  setTimeout(abwarten, 100);

  function wechseln(slot) {
    var eigen = w.FontAwesome;
    if (!eigen || eigen === slot.fa) return;
    try {
      eigen.noAuto(); // stoppt den Beobachter der eigenen Kopie
    } catch (e) {
      return; // eigene Kopie lässt sich nicht anhalten: bei ihr bleiben statt doppelt zu wandeln
    }
    // Alle drei Globalen von icons.js lösen, sonst hält FontAwesomeConfig (Getter/Setter) die Kopie fest
    var namen = ['FontAwesome', '___FONT_AWESOME___', 'FontAwesomeConfig'];
    for (var i = 0; i < namen.length; i++) {
      try {
        delete w[namen[i]];
      } catch (e) {
        w[namen[i]] = undefined;
      }
    }
    teilen(slot.fa, slot.css);
  }

  function teilen(fa, css) {
    w.FontAwesome = fa; // findIconDefinition/i2svg der Kachel-Skripte laufen unverändert weiter
    var st = d.createElement('style');
    st.textContent = css;
    (d.head || d.documentElement).appendChild(st);
    var wandeln = function (knoten) {
      try {
        fa.dom.i2svg({ node: knoten });
      } catch (e) {
        // Knoten schon entfernt oder Hauptfenster weg: nichts zu zeichnen.
      }
    };
    // Eigener Beobachter im Fenster der Kachel: er endet mit ihr (dom.watch im Hauptfenster hielte
    // alte Kachel-Dokumente fest). Wie bei icons.js: neue Knoten und Klassenwechsel am gezeichneten SVG.
    var start = function () {
      wandeln(d.body);
      new MutationObserver(function (liste) {
        var ziele = [];
        for (var i = 0; i < liste.length; i++) {
          var m = liste[i], t = m.target;
          if (m.type === 'childList') {
            if (m.addedNodes.length && ziele.indexOf(t) < 0) ziele.push(t);
          } else if (t.getAttribute && t.getAttribute('data-fa-i2svg') !== null && anderesIcon(t)) {
            neuZeichnen(t);
          }
        }
        for (var j = 0; j < ziele.length; j++) {
          if (ziele[j].isConnected) wandeln(ziele[j]);
        }
      }).observe(d.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    };
    if (d.body) {
      start();
    } else {
      d.addEventListener('DOMContentLoaded', start);
    }
  }

  // Nennen die Klassen des SVG ein anderes Icon als das gezeichnete (data-icon)?
  function anderesIcon(svg) {
    return (' ' + (svg.getAttribute('class') || '') + ' ').indexOf(' fa-' + svg.getAttribute('data-icon') + ' ') < 0;
  }

  // SVG durch ein <i> mit seinen Klassen ersetzen; der Beobachter zeichnet es neu.
  function neuZeichnen(svg) {
    if (!svg.parentNode) return;
    var klassen = (svg.getAttribute('class') || '').replace(/(^|\s)svg-inline--fa(?=\s|$)/g, ' ').trim();
    if (!/(^|\s)(fa-(light|brands|kit|solid|regular|thin|duotone|sharp)|fa[lbkrstd])(\s|$)/.test(klassen)) {
      klassen += ' ' + (svg.getAttribute('data-prefix') || 'fal'); // icons.js lässt die Stilklasse am SVG weg
    }
    var ersatz = d.createElement('i');
    ersatz.className = klassen;
    svg.parentNode.replaceChild(ersatz, svg);
  }
})();

    <!-- /symcon-icons-shared -->
<style>
/* Symcon setzt --card-color, --content-color und --accent-color je nach Visu-Design; alles
   leitet sich daraus ab. Ampelfarben bleiben fest, damit „Alarm" überall gleich aussieht. */
:root {
  --text: var(--content-color, #f2f2f7);
  --surface: color-mix(in srgb, var(--content-color, #f2f2f7) 7%, transparent);
  --border: color-mix(in srgb, var(--content-color, #f2f2f7) 14%, transparent);
  --muted: color-mix(in srgb, var(--content-color, #f2f2f7) 45%, transparent);
  --faint: color-mix(in srgb, var(--content-color, #f2f2f7) 22%, transparent);
  --ok: #34c759;
  --warn: #ff9f0a;
  --alarm: #ff4d4d;
  --sym-mt: 0px;
  --sym-ms: 0px;
  --sym-mb: 0px;
  --sbw: 6px;
  --sb-pad: max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}
html[data-xs-theme="light"] {
  --ok: #248a3d;
  --warn: #c76a00;
  --alarm: #d70015;
  --surface: color-mix(in srgb, var(--content-color, #1c1c1e) 5%, transparent);
}
html { height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: transparent; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#wrap {
  display: flex; flex-direction: column; flex: 1; min-height: 0; box-sizing: border-box; gap: 10px;
  padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad) var(--sym-mb) var(--sym-ms);
}
.randrest { margin-right: calc(var(--sb-pad) + var(--sbw)); }

/* ── Gesamtstatus ─────────────────────────────────────────────────────── */
#status {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 10px 12px; border-radius: 14px; background: var(--surface);
  border: 1px solid transparent;
}
#status .schild {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-size: 20px;
  color: var(--stufe); background: color-mix(in srgb, var(--stufe) 16%, transparent);
}
#status .texte { min-width: 0; }
#status .titel { font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status .zeile { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status .zeile b { color: var(--text); font-weight: 600; }
#status.s0 { --stufe: var(--ok); }
#status.s1 { --stufe: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
#status.s2 {
  --stufe: var(--alarm);
  background: color-mix(in srgb, var(--alarm) 18%, transparent);
  border-color: color-mix(in srgb, var(--alarm) 60%, transparent);
}
#status.s2 .titel { color: var(--alarm); }
/* Alarm: zweimal pulsieren, dann stehen — eine Dauer-Animation hielte die ganze Visu auf 60 Hz */
#status.neu.s2 { animation: puls 0.9s ease-in-out 2; }
@keyframes puls {
  50% { background: color-mix(in srgb, var(--alarm) 40%, transparent); }
}

/* ── Scrollbereich (Liste und Raster) ─────────────────────────────────── */
#bereich {
  flex: 1; min-height: 0; overflow-y: scroll; overflow-x: hidden;
  padding-right: var(--sb-pad); overscroll-behavior: contain;
}
#bereich::-webkit-scrollbar { width: var(--sbw); }
#bereich::-webkit-scrollbar-track { background: transparent; }
#bereich::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent-color, #00cdab) 70%, transparent); border-radius: 999px; }
@supports not selector(::-webkit-scrollbar) {
  #bereich { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent-color, #00cdab) 70%, transparent) transparent; }
}

/* Statussymbole: unauffällig gedämpft, nur Auffälliges farbig */
.sym { display: inline-grid; place-items: center; width: 18px; height: 18px; font-size: 13px; color: var(--faint); }
.sym.warn { color: var(--warn); }
.sym.alarm { color: var(--alarm); }
.sym.unknown { opacity: .5; }

/* ── Liste (kleine Kachel) ────────────────────────────────────────────── */
#liste { display: flex; flex-direction: column; }
.zeile-g {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 4px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.zeile-g:last-child { border-bottom: none; }
.punkt { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.l1 .punkt { background: var(--warn); }
.l2 .punkt { background: var(--alarm); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alarm) 25%, transparent); }
.zeile-g .mitte { flex: 1; min-width: 0; }
.zeile-g .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile-g .hinweis { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l1 .hinweis { color: var(--warn); }
.l2 .hinweis { color: var(--alarm); font-weight: 600; }
.zeile-g .syms { flex: none; display: flex; gap: 2px; }

/* ── Raster (große Kachel) ────────────────────────────────────────────── */
#raster { display: none; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding-bottom: 2px; }
.karte {
  display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer; min-width: 0;
}
.karte.l1 { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.karte.l2 { background: color-mix(in srgb, var(--alarm) 18%, transparent); border-color: color-mix(in srgb, var(--alarm) 70%, transparent); }
.karte .kopf { display: flex; align-items: flex-start; gap: 10px; }
.karte .kopf .texte { flex: 1; min-width: 0; }
.karte .name { font-size: 15px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.karte .modell { font-size: 11px; color: var(--muted); margin-top: 2px; }
.karte .marke {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
  color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent);
}
.karte.l1 .marke { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.karte.l2 .marke { color: var(--alarm); background: color-mix(in srgb, var(--alarm) 20%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.chip.alarm { color: #fff; background: var(--alarm); }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.karte .fuss { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.karte .zeit { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.karte .zeit i { font-size: 10px; margin-right: 2px; }
.karte .syms { display: flex; gap: 2px; flex: none; }

#leer { display: none; flex: 1; place-items: center; color: var(--muted); font-size: 13px; text-align: center; }
.keine #leer { display: grid; }
.keine #bereich { display: none; }

@media (hover: hover) {
  .zeile-g:hover { background: var(--surface); border-radius: 8px; }
  .karte:hover { border-color: color-mix(in srgb, var(--content-color, #f2f2f7) 30%, transparent); }
}

/* ── Größen: sehr klein = nur Status, groß = Raster ──────────────────── */
@media (max-height: 175px) {
  #bereich, #leer { display: none !important; }
  #wrap { justify-content: center; }
  #status { background: transparent; border-color: transparent; padding: 0 4px; }
  #status.s2 { background: color-mix(in srgb, var(--alarm) 18%, transparent); padding: 8px 10px; }
}
@media (min-width: 520px) and (min-height: 380px) {
  #liste { display: none; }
  #raster { display: grid; }
  #status { padding: 14px 16px; }
  #status .schild { width: 48px; height: 48px; font-size: 24px; }
  #status .titel { font-size: 20px; }
  #status .zeile { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  #status.neu.s2 { animation: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="status" class="s0 randrest">
    <div class="schild"><i class="fa-light fa-shield-check"></i></div>
    <div class="texte">
      <div class="titel"></div>
      <div class="zeile"></div>
    </div>
  </div>
  <div id="bereich">
    <div id="liste"></div>
    <div id="raster"></div>
  </div>
  <div id="leer" class="randrest"></div>
</div>
<script>
(function () {
'use strict';

/* Systemränder aus der Adresse, so früh wie möglich: der Rahmen trägt sie, damit der
   Scrollbalken mittig im rechten Randstreifen sitzt. */
(function systemRaender() {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = (name) => {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const s = document.documentElement.style;
    const mt = px('margintop');    if (mt !== null) { s.setProperty('--sym-mt', mt); }
    const ms = px('marginside');   if (ms !== null) { s.setProperty('--sym-ms', ms); }
    const mb = px('marginbottom'); if (mb !== null) { s.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben */ }
})();

/* Hell/Dunkel aus der Helligkeit der Kartenfarbe */
(function () {
  function anwenden() { try {
    const p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    const c = getComputedStyle(p).color; p.remove();
    const m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) { return; }
    const l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-xs-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  anwenden();
  try { if (window.matchMedia) { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', anwenden); } } catch (e) {}
})();

const ICON_ALARM = { smoke: 'fire-smoke', co: 'sensor-cloud', heat: 'temperature-high', water: 'droplet', other: 'siren-on' };
const ICON = {
  fault: 'sensor-triangle-exclamation', battery: 'battery-low', lifeEnd: 'hourglass-end',
  problem: 'circle-exclamation', online: 'wifi', offline: 'wifi-slash', connection: 'link-slash', stale: 'clock'
};
const ICON_OK = { battery: 'battery-full' };

let zustand = null;
let letzteStufe = -1;

const el = (id) => document.getElementById(id);
const text = (k) => (zustand && zustand.texts && zustand.texts[k]) || k;
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const icon = (name) => '<i class="fa-light fa-' + name + '"></i>';

function symbolName(ind) {
  if (ind.key === 'alarm') { return ICON_ALARM[ind.kind] || ICON_ALARM.other; }
  if (ind.key === 'online') { return ind.state === 'warn' ? ICON.offline : ICON.online; }
  if (ind.state === 'ok' && ICON_OK[ind.key]) { return ICON_OK[ind.key]; }
  return ICON[ind.key] || 'circle';
}
function symbole(g) {
  return (g.indicators || []).map((ind) =>
    '<span class="sym ' + esc(ind.state) + '" title="' + esc(text('t_' + ind.key)) + '">' + icon(symbolName(ind)) + '</span>'
  ).join('');
}
/* Text eines Hinweises; ein Alarm nennt seine Art (Rauch, CO, …) */
function hinweisText(g, code) {
  if (code === 'alarm') {
    const a = (g.indicators || []).find((i) => i.key === 'alarm' && i.state === 'alarm');
    return text('i_alarm_' + ((a && a.kind) || 'other'));
  }
  return text('i_' + code);
}
function markeIcon(g) {
  if (g.level === 2) {
    const a = (g.indicators || []).find((i) => i.key === 'alarm' && i.state === 'alarm');
    return ICON_ALARM[(a && a.kind) || 'other'] || ICON_ALARM.other;
  }
  if (g.level === 1) { return ICON[g.issues[0]] || 'triangle-exclamation'; }
  return 'circle-check';
}
function zeitText(ts) {
  if (!ts) { return text('never'); }
  const min = Math.max(0, Math.floor((Date.now() / 1000 - ts) / 60));
  if (min < 1) { return text('justNow'); }
  if (min < 60) { return text('minutesAgo').replace('%d', min); }
  if (min < 48 * 60) { return text('hoursAgo').replace('%d', Math.floor(min / 60)); }
  return text('daysAgo').replace('%d', Math.floor(min / 1440));
}

function zeichneStatus() {
  const o = zustand.overall || { level: 0, total: 0, alarms: 0, warnings: 0, online: 0 };
  const s = el('status');
  const stufe = Math.max(0, Math.min(2, o.level | 0));
  s.classList.remove('s0', 's1', 's2');
  s.classList.add('s' + stufe);
  // das Pulsieren nur beim Übergang in den Alarm, nicht bei jedem Push
  s.classList.toggle('neu', stufe === 2 && letzteStufe !== 2);
  letzteStufe = stufe;

  let titel = text('allSafe');
  let iconName = 'shield-check';
  if (o.total === 0) {
    titel = text('noDevices');
  } else if (stufe === 2) {
    const alarm = (zustand.devices || []).find((g) => g.level === 2);
    titel = alarm ? hinweisText(alarm, 'alarm') : text('alarm');
    iconName = markeIcon(alarm || { level: 2, indicators: [] });
  } else if (stufe === 1) {
    titel = text('warnings');
    iconName = 'triangle-exclamation';
  }
  s.querySelector('.schild').innerHTML = icon(iconName);
  s.querySelector('.titel').textContent = titel;

  const zahl = (n, eins, mehr) => '<b>' + n + '</b> ' + esc(text(n === 1 ? eins : mehr));
  const teile = [zahl(o.total, 'deviceOne', 'devices'), '<b>' + o.online + '</b> ' + esc(text('online'))];
  if (o.alarms > 0) { teile.unshift(zahl(o.alarms, 'alarmOne', 'alarms')); }
  teile.push(zahl(o.warnings, 'noticeOne', 'notices'));
  s.querySelector('.zeile').innerHTML = teile.join(' · ');
}

function zeichneListe(geraete) {
  el('liste').innerHTML = geraete.map((g) => {
    const hinweis = g.issues.length ? g.issues.map((c) => hinweisText(g, c)).join(', ') : '';
    return '<div class="zeile-g l' + (g.level | 0) + '" data-id="' + (g.id | 0) + '">' +
      '<span class="punkt"></span>' +
      '<div class="mitte"><div class="name">' + esc(g.name) + '</div>' +
      (hinweis ? '<div class="hinweis">' + esc(hinweis) + '</div>' : '') + '</div>' +
      '<div class="syms">' + symbole(g) + '</div></div>';
  }).join('');
}

function zeichneRaster(geraete) {
  el('raster').innerHTML = geraete.map((g) => {
    const chips = g.issues.length
      ? g.issues.map((c) => '<span class="chip ' + (c === 'alarm' ? 'alarm' : 'warn') + '">' + esc(hinweisText(g, c)) + '</span>').join('')
      : '<span class="chip ok">' + esc(text('ok')) + '</span>';
    const werte = (g.values || []).map((v) => '<span class="chip">' + esc(v.name) + ' ' + esc(v.value) + esc(v.unit ? ' ' + v.unit : '') + '</span>').join('');
    return '<div class="karte l' + (g.level | 0) + '" data-id="' + (g.id | 0) + '">' +
      '<div class="kopf"><div class="texte"><div class="name">' + esc(g.name) + '</div>' +
      (g.model ? '<div class="modell">' + esc(g.model) + '</div>' : '') + '</div>' +
      '<div class="marke">' + icon(markeIcon(g)) + '</div></div>' +
      '<div class="chips">' + chips + werte + '</div>' +
      '<div class="fuss"><span class="zeit" title="' + esc(text('lastSeen')) + '">' + icon('clock') +
      ' <span data-ts="' + (g.lastSeen | 0) + '">' + esc(zeitText(g.lastSeen)) + '</span></span>' +
      '<span class="syms">' + symbole(g) + '</span></div></div>';
  }).join('');
}

function zeichnen() {
  if (!zustand) { return; }
  const geraete = Array.isArray(zustand.devices) ? zustand.devices : [];
  document.body.classList.toggle('keine', geraete.length === 0);
  el('leer').textContent = text('noDevices');
  zeichneStatus();
  zeichneListe(geraete);
  zeichneRaster(geraete);
}

/* Nur die Zeitangaben nachziehen, ohne neu zu zeichnen */
function zeitenNachziehen() {
  document.querySelectorAll('.zeit [data-ts]').forEach((n) => {
    n.textContent = zeitText(parseInt(n.getAttribute('data-ts'), 10) || 0);
  });
}

el('bereich').addEventListener('click', (ev) => {
  const ziel = ev.target.closest('[data-id]');
  const id = ziel ? parseInt(ziel.getAttribute('data-id'), 10) : 0;
  if (id > 0 && typeof openObject === 'function') { openObject(id); }
});

function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object' || daten.type !== 'state') { return; }
  zustand = daten;
  zeichnen();
}
window.handleMessage = handleMessage;
/* Nur Nachrichten vom eigenen Fenster oder dem einbettenden Elternfenster */
window.addEventListener('message', (event) => {
  if (!event || (event.source !== window && event.source !== window.parent)) { return; }
  handleMessage(event.data);
});

setInterval(zeitenNachziehen, 60000);
})();
</script>
</body>
</html>
